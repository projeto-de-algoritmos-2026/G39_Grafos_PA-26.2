<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Grafo da Cidade</title>
<style>
  body { font-family: sans-serif; background: #f4f4f4; }
  .no { fill: #ff69b4; stroke: white; stroke-width: 3; }
  .no-label { font-size: 14px; font-weight: bold; text-anchor: middle; fill: white; }
</style>
</head>
<body>
  <h1>Grafo da cidade</h1>
  <svg></svg>

  <!-- dados.js e gerado pelo grafo.py: e a fonte unica dos nos/arestas/layout -->
  <script src="dados.js"></script>
  <script>
    // grafo: 32 nos, 4 linhas de 8, arestas lado-com-lado e frente-com-frente
    // (nos, arestas e o tamanho da tela vem de dados.js, gerado por grafo.py,
    // pra layout-rascunho.html nunca ficar dessincronizado do grafo de verdade)
    const COLUNAS = 8;
    const LINHAS = 4;

    // id do no na linha r, coluna c (0-indexado), numerado tipo leitura: 1..32
    // (mesma formula usada em grafo.py pra gerar os ids)
    const idNo = (r, c) => r * COLUNAS + c + 1;

    const NOS = dadosDoGrafo.nos;
    const RUAS = dadosDoGrafo.arestas.map(a => [a.source, a.target]);

    document.querySelector("svg").setAttribute("width", dadosDoGrafo.layout.width);
    document.querySelector("svg").setAttribute("height", dadosDoGrafo.layout.height);

    // espacamento real entre nos vizinhos, calculado a partir das coordenadas
    // que vieram de dados.js (nao mais um valor arbitrario fixado aqui)
    const ESPACAMENTO_X = NOS[1].x - NOS[0].x;
    const ESPACAMENTO_Y = NOS[COLUNAS].y - NOS[0].y;
    const LARGURA_RUA = ESPACAMENTO_Y / 3;

    // estilo da rua, copiando o visual do jogo da Polly
    const COR_ASFALTO = "#a8a6a3";
    const COR_FAIXA = "rgba(255, 255, 255, 0.8)";
    const DIST_FAIXA_PEDESTRE = 48; // distancia da faixa de pedestre ate o no
    const COMPRIMENTO_FAIXA_PEDESTRE = 10; // distancia entre as duas linhas da faixa
    const FOLGA_LINHA_CENTRAL = 6; // espacinho pra faixa central nao encostar na faixa de pedestre

    const svg = document.querySelector("svg");
    const ns = "http://www.w3.org/2000/svg";
    const porId = Object.fromEntries(NOS.map(n => [n.id, n]));

    function el(tag, attrs, pai = svg) {
      const e = document.createElementNS(ns, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      pai.appendChild(e);
      return e;
    }

    // quadras: os espacos vazios no meio da rua, cada um delimitado por 4 nos
    const QUADRAS = [];
    for (let r = 0; r < LINHAS - 1; r++) {
      for (let c = 0; c < COLUNAS - 1; c++) {
        QUADRAS.push([idNo(r, c), idNo(r, c + 1), idNo(r + 1, c + 1), idNo(r + 1, c)]);
      }
    }
    // essa imagem ja vai de ponta a ponta (sem margem transparente) e ja e
    // quase 2:1, entao nao precisa de recorte: so esticar pro tamanho da quadra
    const IMG_CANTEIRO = "imagens/canteiros/quadra-parque.png";

    // preenche uma quadra com a imagem do parque, esticada pra cobrir a
    // quadra inteira (do tamanho ja decidido: 200 de largura x 100 de altura)
    function desenhaQuadra(ids) {
      const pontos = ids.map(id => porId[id]);
      const xs = pontos.map(p => p.x), ys = pontos.map(p => p.y);
      const blocoX = Math.min(...xs) + LARGURA_RUA / 2;
      const blocoY = Math.min(...ys) + LARGURA_RUA / 2;
      const blocoW = Math.max(...xs) - Math.min(...xs) - LARGURA_RUA;
      const blocoH = Math.max(...ys) - Math.min(...ys) - LARGURA_RUA;

      el("image", {
        href: IMG_CANTEIRO,
        x: blocoX, y: blocoY,
        width: blocoW, height: blocoH,
        preserveAspectRatio: "none",
      });
    }

    // faixa de pedestre perto de um no: 2 linhas (uma de cada lado) + 4 retangulos
    // entre elas, um do lado do outro no sentido da linha da rua
    function faixaDePedestre(cx, cy, horizontal) {
      const comprimento = COMPRIMENTO_FAIXA_PEDESTRE; // distancia entre as duas linhas
      const largura = LARGURA_RUA - 16; // ate onde as linhas se estendem pela rua
      const nRetangulos = 5;
      const compRetangulo = comprimento - 4; // quase preenche o vao entre as duas linhas
      const espRetangulo = 4; // espessura (no sentido em que ficam empilhados)

      if (horizontal) {
        // as duas linhas
        el("rect", { x: cx - comprimento / 2 - 1, y: cy - largura / 2, width: 1, height: largura, fill: COR_FAIXA });
        el("rect", { x: cx + comprimento / 2 - 1, y: cy - largura / 2, width: 1, height: largura, fill: COR_FAIXA });

        // os 4 retangulos, no sentido das linhas (empilhados ao longo delas)
        for (let i = 0; i < nRetangulos; i++) {
          const y = cy - largura / 2 + (largura / nRetangulos) * (i + 0.5);
          el("rect", { x: cx - compRetangulo / 2, y: y - espRetangulo / 2, width: compRetangulo, height: espRetangulo, fill: COR_FAIXA });
        }
      } else {
        // as duas linhas
        el("rect", { x: cx - largura / 2, y: cy - comprimento / 2 - 1, width: largura, height: 1, fill: COR_FAIXA });
        el("rect", { x: cx - largura / 2, y: cy + comprimento / 2 - 1, width: largura, height: 1, fill: COR_FAIXA });

        // os 4 retangulos, no sentido das linhas (empilhados ao longo delas)
        for (let i = 0; i < nRetangulos; i++) {
          const x = cx - largura / 2 + (largura / nRetangulos) * (i + 0.5);
          el("rect", { x: x - espRetangulo / 2, y: cy - compRetangulo / 2, width: espRetangulo, height: compRetangulo, fill: COR_FAIXA });
        }
      }
    }

    // desenha uma rua (aresta) entre dois nos
    function desenhaRua(a, b) {
      const horizontal = a.y === b.y;
      const [de, para] = horizontal
        ? (a.x < b.x ? [a, b] : [b, a])
        : (a.y < b.y ? [a, b] : [b, a]);

      // pista de asfalto
      if (horizontal) {
        el("rect", {
          x: de.x, y: de.y - LARGURA_RUA / 2,
          width: para.x - de.x, height: LARGURA_RUA,
          fill: COR_ASFALTO,
        });
      } else {
        el("rect", {
          x: de.x - LARGURA_RUA / 2, y: de.y,
          width: LARGURA_RUA, height: para.y - de.y,
          fill: COR_ASFALTO,
        });
      }

      // faixa central: para um pouco antes da faixa de pedestre de cada lado,
      // pra nao encostar/passar por cima dela
      const insetLinha = DIST_FAIXA_PEDESTRE + COMPRIMENTO_FAIXA_PEDESTRE / 2 + FOLGA_LINHA_CENTRAL;
      el("line", horizontal
        ? { x1: de.x + insetLinha, y1: de.y, x2: para.x - insetLinha, y2: de.y }
        : { x1: de.x, y1: de.y + insetLinha, x2: de.x, y2: para.y - insetLinha }
      ).setAttribute("stroke", COR_FAIXA);
      const linha = svg.lastElementChild;
      linha.setAttribute("stroke-width", 1.5);
      // linha.setAttribute("stroke-dasharray", "22 16");

      // faixas de pedestre perto de cada esquina
      if (horizontal) {
        faixaDePedestre(de.x + DIST_FAIXA_PEDESTRE, de.y, true);
        faixaDePedestre(para.x - DIST_FAIXA_PEDESTRE, para.y, true);
      } else {
        faixaDePedestre(de.x, de.y + DIST_FAIXA_PEDESTRE, false);
        faixaDePedestre(para.x, para.y - DIST_FAIXA_PEDESTRE, false);
      }
    }

    // 1) preenche as quadras (o fundo, atras de tudo)
    for (const ids of QUADRAS) {
      desenhaQuadra(ids);
    }

    // 2) embaixo de cada no, um "quadrado" com cantos arredondados.
    // as ruas que saem do no sao retangulos retos desenhados por cima, entao
    // cobrem (deixam reto) o lado onde tem rua; so sobra curva nas pontas de
    // fora, onde a rua nao continua.
    const RAIO_CURVA = 16;
    for (const no of NOS) {
      el("rect", {
        x: no.x - LARGURA_RUA / 2, y: no.y - LARGURA_RUA / 2,
        width: LARGURA_RUA, height: LARGURA_RUA,
        rx: RAIO_CURVA, ry: RAIO_CURVA,
        fill: COR_ASFALTO,
      });
    }

    // 3) desenha todas as ruas por cima (ficam atras dos nos)
    for (const [a, b] of RUAS) {
      desenhaRua(porId[a], porId[b]);
    }

    // 4) desenha os nos (esquinas) por cima
    for (const no of NOS) {
      el("circle", { cx: no.x, cy: no.y, r: 18, class: "no" });
      const label = el("text", { x: no.x, y: no.y + 5, class: "no-label" });
      label.textContent = no.id;
    }

    // --- sorteio de partida/chegada + dijkstra, feito no navegador -------
    // roda aqui (em vez de em grafo.py) pra cada jogador que abrir a pagina
    // receber um desafio novo automaticamente, sem precisar rodar python de
    // novo. dados.js so guarda a cidade fixa (nos/arestas/pesos).

    function construirListaAdjacencia(arestas) {
      const adjacencia = {};
      for (const no of NOS) adjacencia[no.id] = [];
      for (const aresta of arestas) {
        adjacencia[aresta.source].push([aresta.target, aresta.peso]);
        adjacencia[aresta.target].push([aresta.source, aresta.peso]);
      }
      return adjacencia;
    }

    function distanciaEmArestas(adjacencia, origem) {
      // bfs sem peso: numero minimo de ruas ate cada no, so pra medir o
      // quao "longe" dois pontos estao (o dijkstra depois considera os pesos)
      const distancias = { [origem]: 0 };
      const fila = [origem];
      while (fila.length) {
        const atual = fila.shift();
        for (const [vizinho] of adjacencia[atual]) {
          if (!(vizinho in distancias)) {
            distancias[vizinho] = distancias[atual] + 1;
            fila.push(vizinho);
          }
        }
      }
      return distancias;
    }

    // mesmo valor usado em grafo.py, pra manter a mesma regra do jogo
    const DISTANCIA_MINIMA_ARESTAS = 6;

    function sortearPartidaChegada(adjacencia) {
      const ids = NOS.map(no => no.id);
      while (true) {
        const partida = ids[Math.floor(Math.random() * ids.length)];
        const chegada = ids[Math.floor(Math.random() * ids.length)];
        if (partida === chegada) continue;

        const distancias = distanciaEmArestas(adjacencia, partida);
        if (distancias[chegada] >= DISTANCIA_MINIMA_ARESTAS) {
          return [partida, chegada];
        }
      }
    }

    function dijkstra(adjacencia, origem, destino) {
      const distancias = {};
      for (const id in adjacencia) distancias[id] = Infinity;
      distancias[origem] = 0;
      const anterior = {};
      const visitados = new Set();

      // fila de prioridade simples (grade pequena, nao precisa de heap)
      const fila = [[0, origem]];
      while (fila.length) {
        fila.sort((a, b) => a[0] - b[0]);
        const [custoAtual, atual] = fila.shift();

        if (visitados.has(atual)) continue;
        visitados.add(atual);
        if (atual === destino) break;

        for (const [vizinho, peso] of adjacencia[atual]) {
          const novoCusto = custoAtual + peso;
          if (novoCusto < distancias[vizinho]) {
            distancias[vizinho] = novoCusto;
            anterior[vizinho] = atual;
            fila.push([novoCusto, vizinho]);
          }
        }
      }

      const caminho = [destino];
      while (caminho[caminho.length - 1] !== origem) {
        caminho.push(anterior[caminho[caminho.length - 1]]);
      }
      caminho.reverse();

      return [caminho, distancias[destino]];
    }

    const adjacencia = construirListaAdjacencia(dadosDoGrafo.arestas);
    const [partida, chegada] = sortearPartidaChegada(adjacencia);
    const [caminhoMinimo, custoMinimo] = dijkstra(adjacencia, partida, chegada);

    console.log("partida:", partida, "| chegada:", chegada);
    console.log("caminho minimo (dijkstra):", caminhoMinimo);
    console.log("custo total:", custoMinimo);

    // 5) destaca o caminho minimo encontrado pelo dijkstra, por cima da rua
    const COR_CAMINHO = "#ffd400";
    for (let i = 0; i < caminhoMinimo.length - 1; i++) {
      const a = porId[caminhoMinimo[i]];
      const b = porId[caminhoMinimo[i + 1]];
      el("line", {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        stroke: COR_CAMINHO, "stroke-width": 6,
        "stroke-linecap": "round", opacity: 0.85,
      });
    }

    // 6) destaca os nos de partida (verde) e chegada (vermelho) por cima de tudo
    function destacaNo(id, cor) {
      const no = porId[id];
      el("circle", { cx: no.x, cy: no.y, r: 23, fill: "none", stroke: cor, "stroke-width": 5 });
    }
    destacaNo(partida, "#2ecc71");
    destacaNo(chegada, "#e74c3c");
  </script>
</body>
</html>
